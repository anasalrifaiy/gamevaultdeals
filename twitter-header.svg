<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0F23;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A1A3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D2D5F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8580FF;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#6C63FF;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bgGrad)"/>

  <!-- Glow effects -->
  <circle cx="300" cy="250" r="400" fill="url(#glow)"/>
  <circle cx="1200" cy="250" r="400" fill="url(#glow)"/>

  <!-- Logo Icon (Left) -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="200" height="200" rx="40" stroke="#6C63FF" stroke-width="8" fill="none"/>
    <path d="M50 80L100 130L150 80" stroke="#6C63FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="100" cy="100" r="12" fill="#6C63FF"/>
    <!-- Discount tag -->
    <path d="M140 40 L180 40 L180 80 L160 60 Z" fill="#FF6584"/>
    <circle cx="165" cy="55" r="5" fill="white"/>
  </g>

  <!-- Main Text -->
  <text x="350" y="220" font-family="Orbitron, Arial, sans-serif" font-size="90" font-weight="900" fill="url(#textGrad)">
    GameVault Deals
  </text>

  <!-- Tagline -->
  <text x="350" y="280" font-family="Poppins, Arial, sans-serif" font-size="32" fill="#B8B8D4">
    Unlock Legendary Savings on PC Games
  </text>

  <!-- Features Row -->
  <g transform="translate(350, 320)">
    <!-- Feature 1 -->
    <rect x="0" y="0" width="280" height="70" rx="12" fill="rgba(108, 99, 255, 0.15)" stroke="rgba(108, 99, 255, 0.3)" stroke-width="2"/>
    <text x="140" y="28" font-family="Poppins, Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="600">
      💰 Save up to 90%
    </text>
    <text x="140" y="52" font-family="Poppins, Arial, sans-serif" font-size="16" fill="#B8B8D4" text-anchor="middle">
      Best Prices Guaranteed
    </text>

    <!-- Feature 2 -->
    <rect x="300" y="0" width="280" height="70" rx="12" fill="rgba(108, 99, 255, 0.15)" stroke="rgba(108, 99, 255, 0.3)" stroke-width="2"/>
    <text x="440" y="28" font-family="Poppins, Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="600">
      🎮 300+ Deals
    </text>
    <text x="440" y="52" font-family="Poppins, Arial, sans-serif" font-size="16" fill="#B8B8D4" text-anchor="middle">
      Updated Hourly
    </text>

    <!-- Feature 3 -->
    <rect x="600" y="0" width="280" height="70" rx="12" fill="rgba(108, 99, 255, 0.15)" stroke="rgba(108, 99, 255, 0.3)" stroke-width="2"/>
    <text x="740" y="28" font-family="Poppins, Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="600">
      🏪 All Stores
    </text>
    <text x="740" y="52" font-family="Poppins, Arial, sans-serif" font-size="16" fill="#B8B8D4" text-anchor="middle">
      Steam, Epic, GOG & More
    </text>
  </g>

  <!-- Decorative elements -->
  <circle cx="1350" cy="150" r="60" fill="rgba(255, 101, 132, 0.2)" stroke="#FF6584" stroke-width="3"/>
  <text x="1350" y="165" font-family="Arial" font-size="48" fill="#FF6584" text-anchor="middle" font-weight="bold">
    🔥
  </text>

  <circle cx="1350" cy="350" r="60" fill="rgba(78, 205, 196, 0.2)" stroke="#4ECDC4" stroke-width="3"/>
  <text x="1350" y="365" font-family="Arial" font-size="48" fill="#4ECDC4" text-anchor="middle" font-weight="bold">
    💎
  </text>
</svg>
