<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0F23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A3E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5349E8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="40" fill="#6C63FF" opacity="0.1"/>
  <circle cx="1100" cy="530" r="60" fill="#FF6584" opacity="0.1"/>
  <circle cx="950" cy="80" r="50" fill="#4ECDC4" opacity="0.1"/>

  <!-- Logo circle with icon -->
  <circle cx="200" cy="315" r="100" fill="url(#logoGrad)"/>
  <rect x="150" y="265" width="100" height="100" rx="20" stroke="white" stroke-width="8" fill="none"/>
  <path d="M170 295L200 325L230 295" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="200" cy="315" r="8" fill="white"/>
  <path d="M230 275 L255 275 L255 300 L242.5 287.5 Z" fill="#FF6584"/>

  <!-- Main text -->
  <text x="350" y="290" font-family="Orbitron, Arial Black, sans-serif" font-size="72" font-weight="900" fill="white">
    GameVault Deals
  </text>

  <!-- Tagline -->
  <text x="350" y="345" font-family="Poppins, Arial, sans-serif" font-size="32" font-weight="400" fill="#B8B8D4">
    PC Game Deals &amp; Discounts
  </text>

  <!-- Stats badges -->
  <g transform="translate(350, 380)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="160" height="70" rx="12" fill="#6C63FF" opacity="0.2"/>
    <text x="80" y="30" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#6C63FF" text-anchor="middle">300+</text>
    <text x="80" y="55" font-family="Arial, sans-serif" font-size="16" fill="#B8B8D4" text-anchor="middle">Deals</text>

    <!-- Badge 2 -->
    <rect x="180" y="0" width="160" height="70" rx="12" fill="#FF6584" opacity="0.2"/>
    <text x="260" y="30" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FF6584" text-anchor="middle">90%</text>
    <text x="260" y="55" font-family="Arial, sans-serif" font-size="16" fill="#B8B8D4" text-anchor="middle">Savings</text>

    <!-- Badge 3 -->
    <rect x="360" y="0" width="180" height="70" rx="12" fill="#4ECDC4" opacity="0.2"/>
    <text x="450" y="30" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#4ECDC4" text-anchor="middle">15+ Stores</text>
    <text x="450" y="55" font-family="Arial, sans-serif" font-size="16" fill="#B8B8D4" text-anchor="middle">Legitimate</text>
  </g>

  <!-- Bottom text -->
  <text x="350" y="510" font-family="Arial, sans-serif" font-size="24" fill="#B8B8D4">
    Steam • Epic Games • GOG • EA • Humble Store &amp; More
  </text>

  <!-- Website URL -->
  <text x="350" y="560" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#6C63FF">
    gamevaultdeals.com
  </text>
</svg>
